name: Hub image

# Публичный образ ghcr.io/gfermoto/uav-radar/hub
# Пакет привязан к этому репозиторию меткой source.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - hub/**
      - .github/workflows/hub-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: hub-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Версия из HUB_VERSION
        id: ver
        run: |
          v=$(sed -n 's/^HUB_VERSION = "\(.*\)"/\1/p' hub/nevod_hub.py)
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/gfermoto/uav-radar/hub
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v7
        with:
          context: hub
          file: hub/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Пакет публичный
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for name in hub "uav-radar%2Fhub"; do
            if gh api -X PUT "/user/packages/container/${name}/visibility" -f visibility=public; then
              echo "public: ${name}"
              exit 0
            fi
          done
          echo "пакет запушен, видимость не переключилась — проверьте Packages вручную" >&2
          exit 1
