;
; RTSP mic — Seeed XIAO ESP32-S3 + XMOS XVF3800
; Civil open-source networked microphone (bird / nature recording).
;
; Language (compile-time): default RU; add -DWEBUI_LANG_EN for EN.
;

[common]
platform = espressif32@~6.9.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, direct
; GPIO0/BOOT shared with USB DTR — never assert DTR/RTS in monitor
monitor_dtr = 0
monitor_rts = 0
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

build_flags_common =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DCONFIG_ESP32S3_SPIRAM_SUPPORT=1
    -DCONFIG_SPIRAM_USE_CAPS_ALLOC=1
    -DCONFIG_SPIRAM_USE_MALLOC=1
    -mfix-esp32-psram-cache-issue
    -mfix-esp32-psram-cache-strategy=memw
    -DCONFIG_OPUS_FLOATING_POINT=0
    -DCONFIG_OPUS_PSEUDOSTACK_SIZE=122880
    -DOPUS_ENABLED=1

build_flags_log_verbose =
    -DCORE_DEBUG_LEVEL=4
    -DLOG_LOCAL_LEVEL=ESP_LOG_VERBOSE

lib_deps_common =
    bblanchon/ArduinoJson@^6.21.5
    esphome/AsyncTCP-esphome@^2.1.4
    esphome/ESPAsyncWebServer-esphome@^3.3.2
    knolleary/PubSubClient@^2.8
    sh123/esp32_opus@^1.0.3

; =============================================================================
; rtsp_mic — RTSP Opus mic (DOA/BF/MEL/SPL, no NN / no cloud)
; =============================================================================
[env:rtsp_mic]
platform = ${common.platform}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
monitor_filters = ${common.monitor_filters}
board = seeed_xiao_esp32s3
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
build_flags =
    ${common.build_flags_common}
    ${common.build_flags_log_verbose}
    -DFIRMWARE_DEV
    -DETHERNET_ENABLED=1
build_src_filter =
    +<*>
lib_deps =
    ${common.lib_deps_common}
    arduino-libraries/Ethernet@^2.0.2

; Host unit tests (optional)
[env:native]
platform = platformio/native
test_framework = unity
test_build_src = true
test_filter = test_native
build_flags =
    -std=gnu++17
    -DUNIT_TEST
    -DFIRMWARE_DEV
    -DARDUINO=100
    -DOPUS_ENABLED=1
    -Itest/stubs
    -Isrc
    -lcrypto
build_src_filter =
    +<HighPassFilter.cpp>
    +<XVF3800_Cache.cpp>
    +<TelemetryBuilder.cpp>
    +<MelSpectrogram.cpp>
    +<SystemMonitor.cpp>
    +<SoundLevelMeter.cpp>
    +<LedIndicator.cpp>
    +<LivenessWatchdog.cpp>
    +<NetConfig.cpp>
    +<WebCredentials.cpp>
    +<MQTTManager.cpp>
    -<XVF3800_I2C.cpp>
    -<NTPClient.cpp>
    -<RTSPClient.cpp>
    -<main.cpp>
lib_deps =
    bblanchon/ArduinoJson@^6.21.5
