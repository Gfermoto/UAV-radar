<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>NEVOD · вход</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<link rel="icon" href="/favicon.ico" sizes="any"/>
<link rel="stylesheet" href="/hub_ui/hub.css"/>
<style>
  .login-page #uPass2Wrap,
  .login-page #uTokWrap { display: none !important; }
  .login-page.login-mode-setup #uPass2Wrap { display: block !important; }
</style>
</head>
<body class="login-page login-mode-login">
<script>window.__HUB_UI_CONFIGURED__=null;</script>
<div class="login-card">
  <p class="brand">NEVOD <span>Hub</span></p>
  <p class="tagline" id="loginLead">Вход на панель</p>
  <p class="flash" id="loginErr" hidden></p>
  <form class="mqtt-form" id="loginForm" method="post" action="/" autocomplete="on">
    <label>Логин
      <input id="uUser" name="username" autocomplete="username" required maxlength="32"/>
    </label>
    <label>Пароль
      <input id="uPass" name="password" type="password" autocomplete="current-password" required minlength="8"/>
    </label>
    <label id="uPass2Wrap" hidden>Повтор пароля
      <input id="uPass2" type="password" autocomplete="new-password" minlength="8"/>
    </label>
    <label id="uTokWrap" hidden>Ключ Hub
      <input id="uTok" type="password" autocomplete="off" />
    </label>
    <div class="actions">
      <button type="submit" class="primary" id="uGo">Войти</button>
    </div>
    <p class="hint" id="loginHint" hidden></p>
  </form>
</div>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  let mode = "login";
  function showErr(msg) {
    const el = $("loginErr");
    if (!el) return;
    if (!msg) { el.hidden = true; el.textContent = ""; return; }
    el.hidden = false;
    el.textContent = msg;
    el.classList.add("show", "bad");
  }
  function applyModeClass() {
    document.body.classList.remove("login-mode-login", "login-mode-setup");
    document.body.classList.add(mode === "setup" ? "login-mode-setup" : "login-mode-login");
  }
  function paint() {
    const setupish = mode === "setup";
    $("uPass2Wrap").hidden = !setupish;
    $("uTokWrap").hidden = !setupish;
    applyModeClass();
    const hint = $("loginHint");
    if (hint) {
      hint.hidden = false;
      hint.textContent = mode === "setup"
        ? "Первый запуск: придумайте логин и пароль."
        : "Вход на панель площадки.";
    }
    $("loginLead").textContent = mode === "setup"
      ? "Первый вход"
      : "Вход на панель";
    $("uGo").textContent = mode === "login" ? "Войти" : "Сохранить и войти";
    $("uPass").autocomplete = mode === "login" ? "current-password" : "new-password";
  }
  function setBusy(on) {
    const btn = $("uGo");
    if (!btn) return;
    btn.disabled = on;
    btn.textContent = on ? "Проверка…" : (mode === "login" ? "Войти" : "Сохранить и войти");
  }
  function errText(j, status) {
    const e = (j && j.error) || "";
    if (e === "bad_login") return "Неверный логин или пароль";
    if (e === "bad_ingest_token") return "Неверный ключ";
    if (e === "already_configured") return "Учётка уже задана — войдите";
    if (e === "not_configured") return "Сначала задайте логин";
    if (e === "ui_user_invalid") return "Логин: 1–32 символа A–Z a–z 0–9 . _ -";
    if (e === "ui_password_invalid") return "Пароль ≥ 8 символов, без «:»";
    return e || ("HTTP " + status);
  }
  async function boot() {
    $("loginForm").hidden = true;
    $("loginLead").textContent = "Загрузка…";
    let configured = window.__HUB_UI_CONFIGURED__ === true;
    if (window.__HUB_UI_CONFIGURED__ === false) configured = false;
    try {
      const r = await fetch("/api/hub/ui/status", { cache: "no-store", credentials: "same-origin" });
      if (r.ok) {
        const j = await r.json().catch(() => ({}));
        configured = !!j.configured;
      }
    } catch (_) { /* keep server/default */ }
    mode = configured ? "login" : "setup";
    $("loginForm").hidden = false;
    paint();
  }
  async function submitLogin(ev) {
    if (ev) ev.preventDefault();
    showErr("");
    const user = ($("uUser").value || "").trim();
    const password = $("uPass").value || "";
    const password2 = ($("uPass2").value || "").trim();
    if (mode === "setup") {
      if (password !== password2) { showErr("Пароли не совпадают"); return; }
    }
    setBusy(true);
    const path = mode === "setup" ? "/api/hub/ui/setup" : "/api/hub/ui/login";
    const body = { user, password };
    try {
      const r = await fetch(path, {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
        cache: "no-store",
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { showErr(errText(j, r.status)); setBusy(false); return; }
      location.replace("/");
    } catch (e) {
      showErr(String(e && e.message ? e.message : e));
      setBusy(false);
    }
  }
  $("loginForm").addEventListener("submit", (ev) => { submitLogin(ev); });
  $("uGo").addEventListener("click", (ev) => { ev.preventDefault(); submitLogin(ev); });
  boot();
})();
</script>
</body>
</html>
